name: Formulario - aislamiento de publicación
on:
  push:
    branches: [feature/formulario-cotizacion-zusasa-pruebas, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  endpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: node --experimental-strip-types --test tests/quoteEndpoint.test.cjs
      - run: npm ci --ignore-scripts
      - run: npm run build
