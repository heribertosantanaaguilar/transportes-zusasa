<style>
  html, body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
  }
  .folium-map {
    background: #F5F6F7;
  }
  .leaflet-popup-content-wrapper {
    border-radius: 14px;
  }
  .zusasa-map-header {
    position: fixed;
    z-index: 9999;
    top: 18px;
    left: 18px;
    right: 18px;
    min-height: 86px;
    background: rgba(255,255,255,.94);
    border-radius: 22px;
    box-shadow: 0 18px 45px rgba(10,29,54,.18);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 16px 22px;
    border-left: 8px solid #F26522;
  }
  .zusasa-brand {
    display: flex;
    align-items: center;
    min-width: 250px;
  }
  .brand-small {
    color: #F26522;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 4px;
    line-height: 1;
  }
  .brand-main {
    color: #0A1D36;
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1.05;
  }
  .zusasa-title {
    text-align: right;
  }
  .zusasa-title div {
    color: #0A1D36;
    font-size: 34px;
    line-height: 1.05;
    font-weight: 900;
    letter-spacing: -1px;
    text-transform: uppercase;
  }
  .zusasa-title div span {
    color: #F26522;
  }
  .zusasa-title p {
    margin: 7px 0 0;
    color: #3B4A5A;
    font-size: 16px;
    font-weight: 700;
  }
  .zusasa-legend {
    position: fixed;
    z-index: 9999;
    bottom: 26px;
    left: 26px;
    background: #0A1D36;
    color: white;
    padding: 16px 18px;
    border-radius: 18px;
    box-shadow: 0 18px 45px rgba(10,29,54,.25);
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-weight: 800;
    font-size: 14px;
  }
  .zusasa-legend div {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dot {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex: 0 0 auto;
  }
  .dot.origin {
    background: #0A1D36;
    border: 3px solid #F26522;
  }
  .dot.destination {
    background: #F26522;
    border: 3px solid white;
  }
  .line {
    width: 34px;
    height: 4px;
    background: #F26522;
    border-radius: 99px;
    display: inline-block;
  }
  @media (max-width: 800px) {
    .zusasa-map-header {
      left: 10px;
      right: 10px;
      top: 10px;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      padding: 14px 16px;
    }
    .zusasa-brand {
      min-width: auto;
    }
    .brand-main {
      font-size: 28px;
    }
    .zusasa-title {
      text-align: left;
    }
    .zusasa-title div {
      font-size: 24px;
    }
    .zusasa-title p {
      font-size: 13px;
    }
    .zusasa-legend {
      left: 12px;
      bottom: 12px;
      font-size: 12px;
      padding: 12px 14px;
    }
  }
</style>
